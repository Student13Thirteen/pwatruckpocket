services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_hooks:/pb_hooks
      - ./pb_migrations:/pb_migrations
      - ./pb_public:/pb_public
    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    networks:
      - pwa-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-pwa
    restart: unless-stopped
    depends_on:
      - pocketbase
    volumes:
      - ./cloudflared:/etc/cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run --token ${CLOUDFLARE_TOKEN}
    networks:
      - pwa-net

networks:
  pwa-net:
    driver: bridge
