name: Public repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate public files and security boundary
        run: python3 scripts/validate_public_repo.py

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Check PocketBase hook syntax
        run: node --check pb_hooks/telegram.pb.js

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          Path('/tmp/pwatruckpocket-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/pwatruckpocket-inline.js
