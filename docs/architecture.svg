<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">PwaTruckPocket architecture</title>
  <desc id="desc">Driver Android and browser clients use a resilient queue to send status and documents through Cloudflare to PocketBase, which feeds a server-side Telegram queue for office notifications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <text x="60" y="68" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0f172a">PwaTruckPocket — resilient driver operations flow</text>
  <text x="60" y="104" font-family="system-ui, sans-serif" font-size="18" fill="#475569">Mobile workflow, durable retries and server-side notification boundaries</text>

  <g filter="url(#shadow)">
    <rect x="55" y="160" width="250" height="300" rx="24" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="180" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#0369a1">Driver client</text>
    <rect x="85" y="235" width="190" height="58" rx="14" fill="#eff6ff"/><text x="180" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#1e3a8a">Android app / PWA</text>
    <rect x="85" y="310" width="190" height="58" rx="14" fill="#ecfdf5"/><text x="180" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#065f46">IndexedDB queue</text>
    <rect x="85" y="385" width="190" height="48" rx="14" fill="#fff7ed"/><text x="180" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#9a3412">GPS + file preview</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="400" y="195" width="210" height="230" rx="24" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="505" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#6d28d9">Secure edge</text>
    <rect x="430" y="275" width="150" height="65" rx="14" fill="#f5f3ff"/><text x="505" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#5b21b6">Cloudflare</text><text x="505" y="327" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#6d28d9">outbound tunnel</text>
    <text x="505" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">No router port forwarding</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="705" y="145" width="250" height="330" rx="24" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <text x="830" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="23" font-weight="800" fill="#15803d">PocketBase</text>
    <rect x="740" y="220" width="180" height="48" rx="12" fill="#f0fdf4"/><text x="830" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#166534">Auth + records</text>
    <rect x="740" y="282" width="180" height="48" rx="12" fill="#f0fdf4"/><text x="830" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#166534">Document storage</text>
    <rect x="740" y="344" width="180" height="48" rx="12" fill="#fefce8"/><text x="830" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#854d0e">Telegram queue</text>
    <rect x="740" y="406" width="180" height="42" rx="12" fill="#fff7ed"/><text x="830" y="433" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#9a3412">Retry worker</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="225" width="125" height="180" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="1092" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="800" fill="#1d4ed8">Office</text>
    <circle cx="1092" cy="323" r="34" fill="#dbeafe"/>
    <text x="1092" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30">✈</text>
    <text x="1092" y="379" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#334155">Telegram alerts</text>
  </g>

  <line x1="305" y1="310" x2="400" y2="310" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="352" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">HTTPS / retry</text>
  <line x1="610" y1="310" x2="705" y2="310" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="658" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">API</text>
  <line x1="955" y1="315" x2="1030" y2="315" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="992" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">queued delivery</text>

  <rect x="55" y="515" width="1100" height="58" rx="18" fill="#0f172a"/>
  <text x="605" y="551" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#f8fafc">A failed mobile connection or notification channel does not have to lose the operational transaction.</text>
</svg>